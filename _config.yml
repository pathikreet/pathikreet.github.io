# About Section
# about_title: About Me (Use this to override about section title)
about_profile_image: images/my-avatar.png
layout: top-middle
about_content: |
  Staff Software Engineer at Walmart Global Tech with 16+ years of experience designing scalable platforms, cloud-native systems, and intelligent automation.

  Currently focused on advanced AI use cases for the CI platform, including autonomous remediation of build failures, collective intelligence stored as validated knowledge vectors in a Vector DB, sophisticated RAG pipelines that mark and reuse proven fixes (avoiding repeated inference costs), CI setup suggestions, and automatic configuration for greenfield projects.

  Previously Cloud Architect / Technical Architect at Cognizant, where I designed API-first, PCI-compliant Oracle Cloud native solutions in the payment domain that reduced Capex significantly. Strong foundation in integrations, DevOps, and leading technical teams.

  Passionate about agentic systems, context engineering for AI, and building platforms that get smarter and more cost-efficient over time.

