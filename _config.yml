        sub_title: Staff Software Engineer
        caption: April 2022 - present
        link: https://tech.walmart.com/
        description: |
          * Lead advanced AI use cases on the CI platform, including autonomous remediation of build failures that generates fixes and PRs.
          * Design and operate a collective intelligence system that stores validated fixes as knowledge vectors in a Vector DB; sophisticated RAG pipeline marks vectors as validated based on production signals (e.g., PR merges) and reuses them AS-IS for matching error signatures to avoid inference costs.
          * Additional AI-in-CI work: suggesting CI setup improvements and automatic CI configuration for greenfield projects.
          * Focus on context engineering, cost-efficient agentic pipelines, and systems that improve with usage.
      - layout: left
        title: Cognizant Technology Solutions
        sub_title: Technical Architect / Cloud Architect
        caption: June 2019 - April 2022
        link: https://www.cognizant.com/
        description: |
          * Conceptualized, designed, and built a secure, scalable, data-agnostic, fully pluggable product in the payment domain on Oracle Cloud as a cloud-native solution.
          * Created API strategy & guidelines to securely develop the product and address stakeholder security concerns on public cloud, contributing to significant Capex savings.
          * Designed PCI, WCAG/ADA compliant architectures focused on PaaS, network topology, deployment strategies (multi-tenant, HA, DR), security models, API specifications, and data models.
          * Developed Infrastructure-as-Code pipelines (including Wercker) for automated provisioning, trained teams, and drove incorporation of emerging technologies.
      - layout: left
        title: Tata Consultancy Services
