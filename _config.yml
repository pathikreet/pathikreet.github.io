          * Enhanced the system into a Vulnerability Management System that mitigates business’s time and resources in locating and remediating vulnerabilities in its applications.
          * Implemented Business Rules Management System for the application using DROOLS.
          * Created a security mechanism to avoid data manipulation between the loosely coupled server side(Java/J2EE) and front end technologies(Adobe Flex).
          * Custom mechanism mitigated the risk of manipulating the request and response using interceptor tools like BURP.
