          * Responsible for Code Quality, support and maintenance of all Integrations Systems.
          * Responsible for designing new Middleware and Integration processes on Oracle FMW Stack.
          * Plan and implement Process Improvements over time.
          * Generate repeat business through aggressive POCs and advanced new age Digital technologies.
          * Responsible for creating new base / ground for Digital transformation of customers.
          * Responsible for a team of 15 resources across technologies and grooming them towards full stack developers in line with the DevOps model.
          * Creating a landscape to incorporate the new age technologies along with the matured tech stacks.
      - layout: top-left
        title: Infosys
        sub_title: Senior System Engineer
