    layout: text
    content: |
      **Technical**

      `AI / Agentic Systems` `RAG` `Vector Databases` `LangGraph` `Python` `Go` `Java` `NodeJS` `Kubernetes` `Docker` `Terraform` `CI/CD` `DevOps` `Microservices` `Serverless` `Cloud (Oracle, Azure, others)` `REST` `Spring Boot` `Git` `YAML` `JSON`

      **Non-Technical**

      `Leadership` `Technical Architecture` `Mentoring` `Cross-functional Collaboration` `Process Improvement` `Estimation` `Stakeholder Management`
